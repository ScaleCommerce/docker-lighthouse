name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/scalecommerce/docker-lighthouse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Extract versions.txt
        id: versions
        run: |
          {
            echo 'text<<VERSIONS_EOF'
            docker run --rm "$IMAGE:${{ steps.v.outputs.version }}" cat versions.txt
            echo 'VERSIONS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build release body
        env:
          VERSION: ${{ steps.v.outputs.version }}
          VERSIONS_TXT: ${{ steps.versions.outputs.text }}
        run: |
          {
            echo '## Pull this version'
            echo ''
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo ''
            echo '## Versions'
            echo ''
            echo '```'
            echo "$VERSIONS_TXT"
            echo '```'
          } > release-body.md
          cat release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
