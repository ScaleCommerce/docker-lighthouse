name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/scalecommerce/docker-lighthouse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test published image
        run: |
          docker run --rm "$IMAGE:${{ steps.v.outputs.version }}" \
            lighthouse-quiet https://example.com/ --only-categories=performance \
            | python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); s=d["categories"]["performance"]["score"]; assert isinstance(s,(int,float)), s'
